[project]
name = "project-nyx"
version = "0.1.0"
description = "Local visual-memory retrieval prototype for Nyx"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2,<3",
    "pillow>=11,<13",
    "sqlite-vec>=0.1.6,<0.2",
]

[project.optional-dependencies]
vision = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "transformers>=4.57.1,<6",
    "sentencepiece>=0.2,<1",
]
mlx = [
    "mlx-vlm==0.4.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]
voice = [
    "faster-whisper>=1.2,<2",
]

[project.scripts]
nyx = "nyx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyx"]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "playwright>=1.56,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
